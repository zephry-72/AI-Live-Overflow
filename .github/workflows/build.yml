name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & Gradle wrapper
        working-directory: kotlin
        run: |
          # set local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # install required SDK components (ubuntu-latest has cmdline-tools pre-installed)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          # generate gradle wrapper to lock version 8.5
          gradle wrapper --gradle-version 8.5
          # verify wrapper exists
          ls -la gradlew

      - name: Build debug APK
        working-directory: kotlin
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zero-pet-apk
          path: kotlin/app/build/outputs/apk/debug/*.apk