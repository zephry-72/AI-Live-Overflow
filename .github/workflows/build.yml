name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          build-root-directory: kotlin

      - name: Build debug APK
        run: cd kotlin && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zero-pet-apk
          path: kotlin/app/build/outputs/apk/debug/*.apk